services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: montera-app
    mem_limit: 512m
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      BASE_URL: "${BASE_URL:-http://localhost:${APP_PORT:-8080}/}"
      PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-512M}"
    volumes:
      - .:/var/www/html
    restart: unless-stopped
